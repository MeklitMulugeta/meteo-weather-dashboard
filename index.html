<!doctype html>
<html lang="en">
  <head>

    <title>Weather System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="logo">METEO</div>

        </div>
      </div>
      <div id="right_side">
    <ul>

        <li>

        </li>
        <li>

            <p class="card-value">10 km</p>

</div>
